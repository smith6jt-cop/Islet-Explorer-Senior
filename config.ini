# Islet-Explorer-Senior — Phenocycler_Analysis pipeline configuration.
#
# Consumed by the Phenocycler_Analysis package (add it as a git submodule at
# ./Phenocycler_Analysis and `pip install -e Phenocycler_Analysis` into scvi-env).
# Paths resolve relative to THIS file's directory (the repo root); the
# PHENOCYCLER_* env vars override (see scripts/senior/run_pipeline.sh).
#
# Cohort eligibility is fail-closed in Phenocycler_Analysis/phenocycler/cohort.py.
# Donor 6457 is excluded because poor DAPI staining prevented accurate channel
# registration. Donor 6579 is excluded by maintainer decision as a pancreatitis
# outlier. These are intentionally not tunable config overrides.

[paths]
data_dir = data
images_dir = /home/smith6jt/IO60panc2nd/Images
cells_csv = /home/smith6jt/IO60panc2nd/Cellmeasurements.csv
donor_metadata = /home/smith6jt/IO60panc2nd/donor_metadata_panc.xlsx
restore_vendor = external/RESTORE/python_code

[metadata]
donor_col = donor_id
status_col = disease.status

[redsea]
downsample = 1.0
edge_radius = 0
# 1 = subtract + reinforce (Bai et al. 2021 default). Restored 2026-07-25: with comp_mode = 0 a cell
# whose neighbours all express the marker had its ENTIRE boundary signal subtracted, because F's rows
# sum to 1 in the old recipient form. Measured cost on E-cadherin: 0.37-0.53 of the median retained
# overall and ~0 in the smallest cell-area quintile.
comp_mode = 1
alpha = 1.0
gap_bridge = 1
# donor = the published operator F[i,j] = contact[i,j] / B[j] (mass-conserving). recipient = the pre-v10
# form F[i,j] = contact[i,j] / B[i], retained only to reproduce v9 artifacts.
norm_form = donor
# Pass nuclear + ECM channels through uncorrected (marker_taxonomy.NO_SPILLOVER). Their signal never
# reaches the shared boundary, so compensating them was pure signal loss (DAPI lost 23-30%).
exclude_no_spillover = true

[restore]
model = SSC
subsample = 15000
robust = true
robust_factor = 3.0
min_cell_area = 5.0
seed = 0
# idx_select co-expression floor: per-(image,marker) quantile (scale-invariant) instead of the vendored
# hardcoded >50 (OHSU-calibrated, mismatched to this panel's 16-bit means). 0 = revert to >50.
idx_floor_q = 0.5
# --- 3 opt-in evaluation knobs (defaults reproduce current behavior; activate per-donor from figures) ---
# negative-cluster threshold statistic: mean3sd (vendored mu+3sigma) | mad | logmad | pctile (robust)
neg_stat = mean3sd
# per-image signal-presence guard: 0 = off; >0 calls a marker ABSENT (0 positives) when its idx_select
# cloud shows cluster separation < N negative-sigma (stops mu+3sigma firing on pure noise, e.g. beta-loss INS)
presence_min_sep = 0.0
# REDSEA zero-clip guard: 0 = off; >0 floors the idx_select OFF-marker ceiling at this quantile of the
# marker's NONZERO cells (prevents ceiling collapse to 0 when >=50% of a sparse marker is clamped to 0)
idx_nonzero_q = 0.0
# partner-low thresholding (ENDOCRINE targets INS/GCG/SST only): 0 = off; >0 sets the cutoff from a 2-GMM
# crossover among ISLET cells LOW for the mutually-exclusive reference (reference <= this quantile), where
# the target is cleanly bimodal; +inf/absent if not (beta-loss). Non-endocrine markers use the neg-cluster stat.
partner_low_q = 0.0
# proliferation (Ki67/PCNA) binarization: they are graded, not bimodal -> robust per-donor upper-tail cutoff
# = mean + k*std of log10(nonzero+1). k below (3.0 -> ~0.1-1.4% positive here).
proliferation_k = 3.0

[restore_diag]
# mxnorm RESTORE before/after efficacy diagnostic (scripts/senior/restore_mxnorm_diagnostics.R)
subsample = 20000
seed = 0

[compute]
n_jobs = 8
duckdb_threads = 8
use_gpu = false
gpu_device = 0

[cell_qc]
# Single-cell QC applied BEFORE any parameter estimation (phenocycler.cell_qc). Every value is
# donor-local or scale-free, so none of them normalises across donors.
# Tier 1 - hard exclusion: the object is not a cell, removed from the canonical set.
min_cell_area = 20.0             # um^2. A 5 um disc, still below a lymphocyte (~7 um, ~38 um^2).
                                 # Below this, DAPI is 0.67-0.88x normal in EVERY donor.
require_nucleus = true           # DNA gate. No-nucleus objects carry 0.26-0.41x normal DAPI.
max_area_median_multiple = 4.0   # x the donor's OWN median retained area (lands at 180-302 um^2).
                                 # Above this: E-cadherin 0.39x, Pan-CK 0.29x, Vimentin 3.85x.
min_cell_solidity = 0.70         # area/convex-hull. Circularity is NOT used - it is compartment-
                                 # biased here (removes real elongated stroma: Vimentin 4.6x).
min_raster_area_ratio = 0.5      # rasterized vs reported area; catches the 6450/6523 geometry defect
# Tier 2 - excluded from ESTIMATION only; these cells are real and still get a call.
no_cytoplasm_nc_ratio = 0.999
# Duplicate removal. Detection ran with selectAnnotations(), selecting Tissue AND every nested
# Islet_N; InstanSeg segments each selected parent independently and does not deduplicate across
# parents, so islet nuclei were segmented twice (8/20 donors, 100% of duplicates inside islets).
deduplicate = true
duplicate_radius_um = 1.0        # centroid separation below which two objects are the same cell
duplicate_area_tol = 0.15        # and their areas must agree to within this fraction    # nucleus_area == cell_area -> a membrane marker's "whole-cell
                                 # mean" is a nuclear mean, so it must not set a threshold.
