# Islet-Explorer-Senior — Phenocycler_Analysis pipeline configuration.
#
# Consumed by the Phenocycler_Analysis package (add it as a git submodule at
# ./Phenocycler_Analysis and `pip install -e Phenocycler_Analysis` into scvi-env).
# Paths resolve relative to THIS file's directory (the repo root); the
# PHENOCYCLER_* env vars override (see scripts/senior/run_pipeline.sh).

[paths]
data_dir = data
images_dir = /home/smith6jt/IO60panc2nd/Images
cells_csv = /home/smith6jt/IO60panc2nd/Cellmeasurements.csv
donor_metadata = /home/smith6jt/IO60panc2nd/donor_metadata_panc.xlsx
restore_vendor = external/RESTORE/python_code

[metadata]
donor_col = donor_id
status_col = disease.status

[redsea]
downsample = 1.0
edge_radius = 0
comp_mode = 0
alpha = 1.0
gap_bridge = 1

[restore]
model = SSC
subsample = 15000
robust = true
robust_factor = 3.0
min_cell_area = 5.0
seed = 0
# idx_select co-expression floor: per-(image,marker) quantile (scale-invariant) instead of the vendored
# hardcoded >50 (OHSU-calibrated, mismatched to this panel's 16-bit means). 0 = revert to >50.
idx_floor_q = 0.5
# --- 3 opt-in evaluation knobs (defaults reproduce current behavior; activate per-donor from figures) ---
# negative-cluster threshold statistic: mean3sd (vendored mu+3sigma) | mad | logmad | pctile (robust)
neg_stat = mean3sd
# per-image signal-presence guard: 0 = off; >0 calls a marker ABSENT (0 positives) when its idx_select
# cloud shows cluster separation < N negative-sigma (stops mu+3sigma firing on pure noise, e.g. beta-loss INS)
presence_min_sep = 0.0
# REDSEA zero-clip guard: 0 = off; >0 floors the idx_select OFF-marker ceiling at this quantile of the
# marker's NONZERO cells (prevents ceiling collapse to 0 when >=50% of a sparse marker is clamped to 0)
idx_nonzero_q = 0.0

[restore_diag]
# mxnorm RESTORE before/after efficacy diagnostic (scripts/senior/restore_mxnorm_diagnostics.R)
subsample = 20000
seed = 0

[compute]
n_jobs = 8
duckdb_threads = 8
use_gpu = false
gpu_device = 0
