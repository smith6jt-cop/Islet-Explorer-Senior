# Islet Explorer Senior -- PhenoCycler run cohort (20 donors).
#
# A SECOND DATASET, not a variant of the CODEX one. The legacy 15-donor CODEX build stays with
# Junior; this config carries the run cohort typed by the context-specific subpanels. The two
# share only five donors (6450, 6505, 6521, 6534, 6551) and do not share a vocabulary, so they
# are never merged -- a cross-donor comparison spanning both would compare methods, not biology.
#
# COHORT: 20 donors -- `cohort.CLEAN` (17) + `cohort.MARGINAL` (3), the two lists in
# core/phenocycler/scripts/typing/cohort.py, which is the authority. The summary below is a
# reading aid and nothing in this app derives from it; if the two ever disagree, cohort.py is
# right and these lines are stale. Donor exclusion is a separate question with its own single
# authority -- core/phenocycler/phenocycler/cohort.py, where only 6457 is excluded (6579's
# exclusion was lifted 2026-09-17) -- and no config may restate that list either.
#
#   CLEAN (17)     zero missed islets under all six detection settings swept, and zero duplicated
#                  islet-core detections: 115, 6374, 6436, 6442, 6450, 6461, 6476, 6482, 6493,
#                  6505, 6523, 6534, 6539, 6566, 6591, 6593, 6623. Seven of these are batch-2
#                  donors that joined on 2026-09-15, once the re-export was rebuilt and the
#                  missed-islet sweep was re-run against the new annotations.
#   MARGINAL (3)   a small, real islet deficit -- includable at a STATED cost, not clean. The
#                  cost is the measurement, not the label:
#                    6380  6 missed islets of 67 (9.0%), and 13% of its islet-core cells
#                    6551  2-3 missed islets of 424 (0.5-0.7%)
#                    6521  1-2 missed islets of 395 (0.3-0.5%); the only Aab+ donor outside
#                          batch 2, which is the only reason it is in at all
#
# An earlier version of this header named ten donors and asserted "NO Aab+ donor". That was true
# of the pre-2026-09-15 build and is not true of this one. Measured in
# data/development/typing/app/parquet/islets.parquet on 2026-09-18: 18,384 islets over 20 donors,
# 3,966 of them Aab+ across three donors (6450, 6505, 6521); 8 ND / 3 Aab+ / 9 T1D. The
# ND-vs-T1D-only restriction the old header described no longer applies.
#
# What still does not follow from this cohort: acquisition batch remains aliased with disease
# status at the coarse level. Correct on stain_group or acq_run, never on batch, and stratify
# where correction is not warranted. See cohort.COHORT_LIMITS.
#
# The class list is deliberately coarse. This panel carries no acinar-specific and no
# ductal-specific marker, so Exocrine is one label; immune subsets are not resolved, so Immune
# is one label. Nothing here may be split further without a marker that can split it.
#
# THE NINTH ENTRY IS NOT A NINTH CELL TYPE. `Unresolved` is what the refinement pass
# (core/phenocycler/scripts/typing/refine.py, label `Unresolved (no lineage evidence)`) writes
# on a cell it demoted out of Exocrine: Exocrine is the complement class, so there is no
# complement beneath it and the cell is left with no lineage evidence at all. That is the
# ABSENCE of a call, not a split of one, and the rule above still holds -- nothing here has
# been split, and nothing may be without a marker that can split it.
#
# It is therefore excluded from `phenotypes.display_order`'s reading as a cell-type vocabulary
# by two declarations, not by its spelling: it is listed under `phenotypes.residuals` with
# `absence: true` (read by ieCore::ie_absence_phenotypes(), which is what a tab asks instead of
# matching the label), and its colour is ieCore::ie_absence_class_color() -- the `uncalled`
# entry of the availability palette in apps/R/ieCore/R/ie_availability.R, which is achromatic
# on purpose while every class colour below carries a hue. The hex is repeated here because
# YAML cannot call R; apps/islet/tests/testthat/test-ninth-class.R asserts the two agree.
#
# STATE AS OF 2026-09-18: NO CELL CARRIES THIS LABEL YET. The refinement pass is written and is
# NOT wired to anything -- `refined_class` has no consumer, build_cells.py still sets `phenotype`
# from `cell_class`, and data/development/typing/cells/ is the 2026-09-15 build of 25,230,109
# cells with eight classes plus `Excluded`. NO DONOR HAS BEEN RE-RUN with the 2026-09-18 islet
# chain either: that build predates the CD99 question, the per-donor-and-per-stratum CD99 level,
# the elongation second route and the structure/top-marker requirement, so nothing in this app
# has yet been typed by the chain the method documents describe. Measured 2026-09-18 in
# data/development/typing/app/parquet/islets.parquet: the only composition columns present are
# `count_*` / `prop_*` / `peri_*` / `enrich_z_*` / `min_dist_*` over the eight classes -- there is
# no `Unresolved` column of any kind. The entry is declared ahead of the data deliberately,
# so that a card meets a named absence rather than an unmapped value the first time one appears;
# it is not a claim that any islet number in this app currently contains one. It also remains an
# OPEN QUESTION whether the pass should run at all: its 5th-percentile bound demotes about 5 % of
# every class by construction, and on Exocrine -- 80 % of the tissue -- the measured demotion sits
# 0.2-0.5 pp above that floor, which would make roughly a million cells `Unresolved` for being in
# the bottom 5 % of the largest class rather than for any measured absence of keratin.

app:
  name: Islet Explorer Senior — Run Cohort
  title: Islet Explorer Senior — PhenoCycler run cohort (20 donors — 17 clean, 3 marginal)
  url_path: islet-explorer-run20

unit:
  singular: islet
  plural: islets
  Title: Islet
  key_column: islet_key
  id_prefix: Islet
  id_regex: "Islet_\\d+"
  peri_suffix: _exp20um
  case_id_pad_width: 4
  diam_column: islet_diam_um

pixel_size_um: 0.5078

grouping:
  physical_column: "Donor Status"
  display_label: Donor status
  levels: [ND, Aab+, T1D]
  ordered: true
  default_palette: Okabe-Ito
  palettes:
    "Paul Tol (default)": {ND: "#4477AA", Aab+: "#CC6633", T1D: "#228833"}
    Bright: {ND: "#3366CC", Aab+: "#FF6600", T1D: "#109618"}
    Okabe-Ito: {ND: "#0072B2", Aab+: "#D55E00", T1D: "#009E73"}
    Diverging: {ND: "#2166AC", Aab+: "#B2182B", T1D: "#1B7837"}

regions:
  items:
    - {id: core, canonical: islet_core, display: Islet core, geojson_class: Islet, is_core: true}
    - {id: band, canonical: islet_band, display: Peri-islet expansion, geojson_class: ~, is_core: false}
    - {id: union, canonical: islet_union, display: Core + peri-islet, geojson_class: ~, is_core: false}
    # Correction E: the part of an islet and its expansion that is not endocrine cells. Declared
    # here and not in islet_default.yml, so the CODEX cohort is unchanged. The `_nonendo` suffix
    # is what build_workbook.py writes into Islet_Targets.region.
    - {id: nonendo, canonical: islet_non_endocrine, display: Non-endocrine (islet + expansion),
       geojson_class: IsletNonEndocrine, is_core: false}
  expansion:
    display: Peri-islet
    geojson_class: IsletExpanded
    distance_um: 20
  structures:
    - {class: Nerve, display: Nerve, color: "#B5838D"}
    - {class: Capillary, display: Blood vessel, color: "#BC4749"}
    - {class: Lymphatic, display: Lymphatic, color: "#84A98C"}
  colors: {core: "#0066CC", expansion: "#00CCCC", non_endocrine: "#8C6BB1"}
  # Read by the Plot tab under every composition measure. Corrections A and G changed what the
  # denominator counts, so it is stated rather than assumed.
  denominator_note: >-
    Denominator: analysis-eligible cells in the region — a detection with no nucleus is not counted
    anywhere, nor is an exocrine call inside the islet border. An islet with no cells in a region
    has no proportion there, not a zero. Where the refinement pass has run, the denominator also
    contains cells the typing resolved no identity for (Unresolved), so the eight class
    proportions no longer sum to 1 — the remainder is that absence, not a shortfall in any class.

# The eight classes the subpanels decide, then the one recorded absence -- and nothing else.
phenotypes:
  # Shown in the Plot tab's measure-group headings. Not scVI: these eight classes come from the
  # subpanel classification (core/phenocycler/scripts/typing/RECONSTRUCTION.md).
  classifier_label: subpanel classification
  # Order: the eight classes first, in the order they were established, then the absence LAST.
  # An absence is not a member of the vocabulary it sits beside, so it never sorts among it.
  display_order: [Beta_cell, Alpha_cell, Delta_cell, Exocrine, Blood_Vessel,
                  Lymphatic, Neural, Immune, Unresolved]
  colors:
    Beta_cell: "#E63946"
    Alpha_cell: "#F4A261"
    Delta_cell: "#E9C46A"
    Exocrine: "#A8DADC"
    Blood_Vessel: "#BC4749"
    Lymphatic: "#84A98C"
    Neural: "#B5838D"
    Immune: "#3A5A8C"
    # ieCore::ie_absence_class_color(). Achromatic (R == G == B) while all eight above carry a
    # hue, so "no hue" reads as "no identity" without a legend having to say so. Kept at mid
    # grey rather than near-white because a class nobody can see on the plot is a worse lie
    # than one in the wrong colour.
    Unresolved: "#6E6E6E"
  residuals:
    # `absence: true` is the machine-readable half of the note at the top of this file. A tab
    # asks ieCore::ie_absence_phenotypes() rather than matching the string "Unresolved".
    - name: Unresolved
      parent: all
      absence: true
      description: >-
        NOT a cell type. The refinement pass demoted this cell out of Exocrine because none of
        Exocrine's own markers reached the class bound among its concordant neighbours, and
        Exocrine is the complement class, so there is no complement beneath it. The producer
        label is `Unresolved (no lineage evidence)`. It records that the typing was run and
        resolved no identity -- which is neither a measurement that is missing nor a cell that
        was never typed, and never a zero of any class. Counting it as a phenotype proportion
        beside the eight classes would report an absence as a population.

# Where this dataset's files live. Read by 00_globals.R; a config without this block falls back
# to the historical data/app_data paths, so islet_default.yml is unaffected.
data:
  root: "../../data/development/typing/app"
  master: "master_results_run10.xlsx"
  islet_proportions: "islet_celltype_proportions.csv"
  # No MASTER h5ad: the app reads this dataset through the DuckDB Parquet views (parquet/), which
  # load_master_duckdb() tries before the H5AD and before Excel. The Trajectory tab's own file is
  # separate and does exist -- adata_ins_root.h5ad, islet composition ordered by diffusion
  # pseudotime, resolved by mod_trajectory_server.R from the domain root directly.
  h5ad: ~
