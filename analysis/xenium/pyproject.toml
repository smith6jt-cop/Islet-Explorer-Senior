# Tool configuration only — deliberately no [project] table.
#
# A second distribution in the monorepo would confuse setuptools-scm, which already derives
# core/phenocycler's version from git. This file exists so ruff and pytest behave the same
# here as they did upstream, nothing more.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
