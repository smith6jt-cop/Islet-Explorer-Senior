name: Islet app (R)

# SCOPE, stated plainly: this is a syntax gate, an install check for ieCore,
# and data-independent unit/contract tests. It is not full browser coverage.
#
# The app needs shiny, bslib, duckdb, rdeck and reticulate. Installing that stack in CI is a
# ~20-minute job and rdeck does not install cleanly from CRAN, so nothing here loads the app.
# scripts/test_viewer_helpers.R is the one real test that can run unattended: its own header
# says "base R only; no Shiny needed", and it works by parse()ing viewer_helpers.R and
# eval'ing five named functions.
#
# parse() catches exactly what it says -- syntax errors, and any file that stopped being
# loadable after a rename. That is worth having on every PR; it is not worth calling coverage.

on:
  push:
    branches: [main]
    paths:
      - 'apps/islet/**'
      - 'apps/R/ieCore/**'
      - 'apps/lymph/**'
      - 'scripts/**/*.R'
      - '.github/workflows/islet-r.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/islet/**'
      - 'apps/R/ieCore/**'
      - 'apps/lymph/**'
      - 'scripts/**/*.R'
      - '.github/workflows/islet-r.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parse:
    name: Parse and unit-test the R sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's precompiled r-cran-* debs bundle their system dependencies
      # (BLAS/LAPACK, gfortran runtime, etc.), so there is no compilation and no binary
      # lookup to go wrong. Only what tests/testthat needs is installed: the full app also
      # wants sf / reticulate / anndata / shiny plus the gitignored data/, which is why this
      # workflow parse-checks the app rather than sourcing it.
      - name: Install R and test packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core \
            r-cran-testthat r-cran-dplyr r-cran-tidyr \
            r-cran-tibble r-cran-lme4 r-cran-lmertest \
            r-cran-ggplot2 r-cran-stringr r-cran-yaml r-cran-readxl

      - name: Every R source parses
        run: Rscript apps/islet/tests/parse_check.R

      - name: Shared ieCore package installs
        run: |
          mkdir -p /tmp/iecore-library
          R CMD INSTALL --library=/tmp/iecore-library apps/R/ieCore
          Rscript -e '.libPaths(c("/tmp/iecore-library", .libPaths())); library(ieCore); d <- ie_load_domain("apps/islet/config/islet_default.yml"); stopifnot(domain_pixel_size(d) == 0.5078)'

      - name: Unit tests (testthat)
        # Inherited from the Junior app lane in the 2026-08-16 merge, along with the
        # utilities they exercise. The suite now also checks both domain configs,
        # every tab's wiring, and the synthetic lymph data contract.
        run: |
          cd apps/islet
          Rscript tests/run_tests.R

      - name: Viewer-helper unit tests
        # Base R only. Also the canary for the apps/islet rename: it parse()s
        # apps/islet/R/viewer_helpers.R by path, so a bad move fails here.
        run: Rscript scripts/test_viewer_helpers.R

      - name: The app's data paths stay two levels below the repo root
        # apps/islet is exactly 2 deep, so file.path("..","..") from the app's working
        # directory is the repo root. Nesting the app one level deeper would silently break
        # all 16 of these call sites at runtime, not at parse time -- hence a real check.
        run: |
          Rscript -e '
            depth <- length(strsplit("apps/islet", "/")[[1]])
            if (depth != 2L) {
              cat("apps/islet is", depth, "levels deep; the file.path(\"..\",\"..\") data paths require exactly 2\n")
              quit(status = 1)
            }
            fs <- list.files("apps/islet/R", "[.]R$", full.names = TRUE)
            hits <- sum(vapply(fs, function(f) {
              length(grep("file.path(\"..\", \"..\"", readLines(f, warn = FALSE), fixed = TRUE))
            }, integer(1)))
            if (hits == 0L) {
              cat("expected depth-2 data paths in apps/islet/R and found none - did the layout change?\n")
              quit(status = 1)
            }
            cat("apps/islet depth OK (2);", hits, "depth-2 call sites intact\n")'
