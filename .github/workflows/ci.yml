name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Fatal Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Syntax and undefined-name gate
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

  current:
    name: Current workflow (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install current workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Version and live module contracts
        run: |
          python -c "import phenocycler; assert phenocycler.__version__ != '0.0.0+unknown'; print('version:', phenocycler.__version__)"
          python -c "from phenocycler.pipeline import DEFAULT_STAGE_ORDER, STAGE_ORDER; assert DEFAULT_STAGE_ORDER == ('ingest', 'geometry', 'redsea', 'expression'); print('all stages:', STAGE_ORDER)"
          python -c "import importlib, pkgutil, phenocycler; names = [m.name for m in pkgutil.iter_modules(phenocycler.__path__) if m.name != 'integration']; [importlib.import_module(f'phenocycler.{name}') for name in names]; print('live core modules import OK:', ', '.join(names))"
      - name: Fast deterministic default suite
        run: pytest -q

  research:
    name: Research-method tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Explicit research suite
        run: pytest -q tests/research

  integration:
    name: Integration tests (no silent skips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the declared integration stack
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[integration,test]'
      - name: Dependency and panel preflight
        run: |
          python -c "import anndata, cv2, geopandas, h5py, scanpy, shapely, SimpleITK, spatialdata, spatialdata_io, zarr; print('integration dependency preflight OK')"
          test -f external/XeniumPanelExplorer/data/panel_roles.csv
      - name: Explicit integration suite
        run: |
          pytest -q tests/integration --junitxml=integration-results.xml
          python -c "import xml.etree.ElementTree as ET; suites = ET.parse('integration-results.xml').getroot().iter('testsuite'); skipped = sum(int(s.get('skipped', '0')) for s in suites); assert skipped == 0, f'integration suite silently skipped {skipped} tests'"
      - name: Integration status surfaces load without data
        run: |
          python -m phenocycler.integration.pipeline --status
          python -m phenocycler.integration.manifest --report
