name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Fatal Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements-ci.txt
      - name: Syntax and undefined-name gate
        # Narrow and fatal: syntax errors and undefined names only. This is a real gate and
        # is expected to stay green.
        run: ruff check --select E9,F63,F7,F82 --output-format=github .
      - name: Full ruff check (advisory)
        # Advisory until the backlog is cleared; promote to a gate by deleting
        # continue-on-error once `ruff check .` is clean.
        continue-on-error: true
        run: ruff check --output-format=github .
      - name: ruff format --check (advisory)
        continue-on-error: true
        run: ruff format --check .

  current:
    name: Current workflow (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install current workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Version and stage contract
        run: |
          python -c "import phenocycler; v = phenocycler.__version__; print('version:', v); assert v != '0.0.0+unknown', 'setuptools-scm did not resolve a version'"
          python -c "from phenocycler.pipeline import DEFAULT_STAGE_ORDER, STAGE_ORDER; assert DEFAULT_STAGE_ORDER == ('ingest', 'geometry', 'redsea', 'expression'), DEFAULT_STAGE_ORDER; print('all stages:', STAGE_ORDER)"
      - name: Core pipeline imports in the lean environment
        # The integration layer must not leak dependencies into the core pipeline. If this
        # step fails, something in phenocycler/ started importing scanpy/spatialdata at
        # module load and the lean environment is broken.
        #
        # Discovered with pkgutil rather than a hardcoded list: the list form silently rots
        # when a module is added, and hard-fails when one is retired.
        run: |
          python -c "import importlib, pkgutil, phenocycler; names = [m.name for m in pkgutil.iter_modules(phenocycler.__path__) if m.name != 'integration']; [importlib.import_module(f'phenocycler.{name}') for name in names]; print('live core modules import OK:', ', '.join(names))"
      - name: Fast deterministic default suite
        # testpaths = tests/current. -rs reports skip reasons: a silently skipped test reads
        # exactly like a passing one in the summary line.
        run: pytest -q -rs

  research:
    name: Research-method tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Explicit research suite
        run: pytest -q -rs tests/research

  integration:
    name: Integration tests (no unexplained skips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Submodules are fetched in a SEPARATE, non-fatal step below rather than here.
          #
          # `submodules: recursive` aborts the whole job on a clone failure, before a single
          # test runs. XeniumPanelExplorer is private, and the default GITHUB_TOKEN is scoped
          # to this repository only, so cloning it 404s ("Repository not found" — GitHub does
          # not distinguish private-and-unauthorised from absent). The result was an eight
          # second red job that said nothing about the code under test.

      - name: Fetch the panel taxonomy submodule (non-fatal)
        id: taxonomy
        continue-on-error: true
        # Give it credentials if they exist, so full coverage is one repository secret away:
        # add a PAT or deploy key with read access to XeniumPanelExplorer as PANEL_EXPLORER_TOKEN
        # (or make that repository public again, which is what it was when this job last ran
        # green). Without either, this step fails, the crosswalk tests skip, and the next step
        # says so loudly.
        env:
          TOKEN: ${{ secrets.PANEL_EXPLORER_TOKEN }}
        run: |
          if [ -n "${TOKEN}" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the declared integration stack
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[integration,test]'
      - name: Dependency preflight
        # These are declared dependencies of the integration extra, not optional niceties.
        # The polygon and crossmodal tests guard on importorskip, so a missing one would
        # skip them and still report green.
        run: |
          python -c "import anndata, cv2, geopandas, h5py, scanpy, shapely, SimpleITK, spatialdata, spatialdata_io, zarr; print('integration dependency preflight OK')"

      - name: Panel taxonomy — present, or visibly absent
        id: panel
        # The crosswalk tests skip gracefully when the taxonomy is missing (right behaviour
        # for a local checkout), so a silent submodule failure used to look exactly like a
        # pass. This step still refuses to let that happen — but it distinguishes the two
        # ways it can be missing, because they call for different responses:
        #
        #   * checkout could not reach the repository at all -> an access problem outside this
        #     repo (see the fetch step). Warn loudly and let the rest of the suite run rather
        #     than reporting red for a reason no change here can fix.
        #   * checkout succeeded but the file is missing or partial -> the submodule really is
        #     broken, which is the case the original hard assertion existed for. Still fatal.
        run: |
          if [ -f external/XeniumPanelExplorer/data/panel_roles.csv ]; then
            echo "panel taxonomy present — crosswalk tests will run"
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.taxonomy.outcome }}" = "failure" ]; then
            echo "::warning title=Panel taxonomy unavailable::Could not clone \
            external/XeniumPanelExplorer (it is private and no PANEL_EXPLORER_TOKEN secret is \
            set), so the PhenoCycler<->Xenium crosswalk tests are SKIPPED, not passing. Make \
            that repository public again, or add a read-scoped PAT/deploy key as \
            PANEL_EXPLORER_TOKEN, to restore that coverage."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "Submodule checked out but data/panel_roles.csv is missing — the taxonomy is" >&2
            echo "incomplete, which the crosswalk tests would silently skip past." >&2
            exit 1
          fi

      - name: Explicit integration suite
        # Zero skips is still the contract, but only when everything the suite needs is
        # actually present. When the taxonomy could not be cloned, the crosswalk skips are
        # expected and already reported as a warning above; asserting zero there would make
        # this job permanently red for a reason no code change in this repo can fix.
        run: |
          pytest -q -rs tests/integration --junitxml=integration-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import os
          skipped = sum(
              int(s.get("skipped", "0"))
              for s in ET.parse("integration-results.xml").getroot().iter("testsuite")
          )
          if os.environ["PANEL_PRESENT"] == "true":
              assert skipped == 0, f"integration suite silently skipped {skipped} tests"
              print("integration suite: 0 skips, taxonomy present")
          else:
              print(f"integration suite: {skipped} skips, all attributable to the absent panel taxonomy")
          PY
        env:
          PANEL_PRESENT: ${{ steps.panel.outputs.present }}

      - name: Integration status surfaces load without data
        run: |
          python -m phenocycler.integration.pipeline --status
          python -m phenocycler.integration.manifest --report
