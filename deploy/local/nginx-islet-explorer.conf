# Workstation nginx front end (port 8080) serving BOTH apps.
#
# Junior's two location blocks below are byte-for-byte the maintainer's own (2026-09-14 12:34),
# including the alias repointed to /data/panc_CODEX after the move. Nothing about Junior changes.
# The Senior blocks are additive.
#
# Why the two apps cannot collide: nginx prefix matching compares literal characters, and
# `/islet-explorer/` fails against `/islet-explorer-senior/...` at the `-`. Longest matching
# prefix wins regardless of order, so each app's local_images block also beats its own app block.

server {
listen 8080;
server_name _;

# ---- Junior (unchanged) ------------------------------------------------------------------
location /islet-explorer/local_images/ {
alias /data/panc_CODEX/Islet-Explorer/app/shiny_app/www/local_images/;
add_header Accept-Ranges bytes;
try_files $uri =404;
}
location /islet-explorer/ {
proxy_pass http://127.0.0.1:3838/islet-explorer/;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;
}

# ---- Senior, the PhenoCycler run cohort (new) --------------------------------------------
# The images are the 10 converted OME-TIFFs, up to 89 GB each. Avivator streams them by HTTP
# Range, so this block exists to serve them straight off disk instead of through the Node
# proxy. `apps/islet/www/local_images` is already a symlink to the same directory, so
# shiny-server could serve them too -- but this block SHADOWS that path, which means a wrong
# alias here produces a blank viewer rather than a fallback. Verify it after reloading.
location /islet-explorer-senior/local_images/ {
alias /data/islet_ome_tiff/;
add_header Accept-Ranges bytes;
try_files $uri =404;
}
location /islet-explorer-senior/ {
proxy_pass http://127.0.0.1:3838/islet-explorer-senior/;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;
}

# ---- TissUUmaps tile server for Senior's Viewer tab (new) ---------------------------------
# Same origin on purpose. An iframe src of http://127.0.0.1:5100 resolves in the VIEWER's
# browser, so it only works for someone sitting at this machine; nginx here listens on
# 0.0.0.0:8080, so going through it works for everyone. Once this block is installed, set
# TISSUUMAPS_URL = "/tissuumaps" in apps/islet/.Rprofile (it defaults to the direct port).
#
# The server must already be listening on 5100, or every load is a 502:
#   systemctl --user enable --now islet-tissuumaps-workstation
# (deploy/islet-tissuumaps-workstation.service -- NOT the Quadlet container unit, which is
# for the RC PubApps VM and needs podman, which this workstation does not have.)
location /tissuumaps/ {
# THE TRAILING SLASH ON proxy_pass IS LOAD-BEARING. Without it the /tissuumaps/ prefix
# reaches the upstream, TissUUmaps reads it as a project path and 302s to
# /<case>.tmap?path=tissuumaps -- off the prefix, and the iframe breaks.
proxy_pass http://127.0.0.1:5100/;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Prefix /tissuumaps;
# The region overlays are large and set autoLoad:true -- regions/115.geojson is 110 MB and
# the ten total ~712 MB, one pulled on every iframe open. Buffering a body that size to
# disk would stall the first paint, so stream it.
proxy_buffering off;
proxy_read_timeout 300s;
}
}
