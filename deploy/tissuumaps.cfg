# deploy/tissuumaps.cfg — Flask config for the TissUUmaps viewer container.
#
# Mounted over /tissuumaps.cfg, which the upstream image already points
# TISSUUMAPS_CONF at (see container/Dockerfile: ENV TISSUUMAPS_CONF /tissuumaps.cfg).
# Python syntax — this is loaded with Flask's config.from_pyfile().

# Public deployment: no writing back through the web UI. Users can still draw
# regions in the browser and download the GeoJSON; they just cannot save to the
# server. Leaving this False on an open host exposes a writable file browser
# over SLIDE_DIR.
READ_ONLY = True

# Root the server serves from. The quadlet mounts the project directory here
# read-only, so .tmap files resolve as /<case_id>.tmap.
SLIDE_DIR = "/mnt/data/shared/"

# No landing project — the Shiny app always links to a specific <case>.tmap.
DEFAULT_PROJECT = False

# Tile format/quality for the DZI tiles TissUUmaps generates on the fly from the
# per-channel pyramids. The pyramids are already 8-bit; jpeg keeps tiles small.
DEEPZOOM_FORMAT = "jpeg"
DEEPZOOM_TILE_QUALITY = 90

# The channel pyramids are pre-generated by build_tissuumaps_project.py, so the
# server should never need its own vips conversion pass. If it ever does (an
# unconverted file dropped into the volume), a read-only mount makes it fail
# fast rather than silently writing a .tissuumaps/ cache next to the data.
