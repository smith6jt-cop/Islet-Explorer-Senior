# deploy/nginx-images.conf — Range-capable static serving for the Viewer OME-TIFFs.
# Bind-mounted into the nginx sidecar at /etc/nginx/conf.d/default.conf.
server {
  listen 80;
  server_name _;

  # Avivator/Viv streams pyramid tiles via HTTP Range; nginx returns 206 for static
  # files by default. The app builds same-origin URLs of the form
  #   https://islet-explorer.rc.ufl.edu/local_images/<case>.ome.tiff
  # and Avivator derives the sidecar <case>.offsets.json from the same directory.
  location /local_images/ {
    alias /usr/share/nginx/html/local_images/;
    autoindex off;
    add_header Accept-Ranges bytes;
    sendfile on;
    tcp_nopush on;
  }
}
