schema: multiplex5000-profile/1
kind: tissue
id: pancreas
display_name: pancreas
# Spellings that mean this tissue (lowercased, spaces and hyphens as underscores).
aliases: [pancreas, panc, pan, pancreatic]
# ROI prefixes in section keys that belong to this tissue.
roi_prefixes: [pan]
# core/panels/data/tissues/<dir>: the tissue's own identity cores; null = the shared pool.
panel_tissue_dir: pancreas
# Identity cores that must not be applied to any other tissue.
tissue_only_panels: [01_pancreas_endocrine, 02_pancreas_exocrine, 13_fibroblast_stellate]
# Structure kinds the tissue supports; an empty list means the structure level does not run.
structures: [islet, duct, vessel]
# Common lineages worth comparing for this tissue.
comparable_lineages: [Endocrine, Exocrine, Stromal, Vascular, T_NK, B_Plasma, Myeloid, Neural]
# The tissue plugin (logic that differs, not numbers): the islet chain. Written in phase D6.
plugin: pancreas
# Until phase D2 these values MIRROR the constants below; tests/current/test_profiles.py fails if
# they disagree.
sources:
  display_name: phenocycler/integration/tissues.py DISPLAY_NAME
  aliases: phenocycler/integration/tissues.py normalize()
  roi_prefixes: phenocycler/integration/tissues.py ROI_PREFIX_TO_TISSUE
  panel_tissue_dir: phenocycler/integration/tissues.py PANEL_TISSUE_DIR
  tissue_only_panels: phenocycler/integration/tissues.py PANCREAS_ONLY_PANELS
  structures: phenocycler/integration/tissues.py STRUCTURE_KINDS
  comparable_lineages: phenocycler/integration/tissues.py COMPARABLE_LINEAGES
