# Portable defaults for the manifest-driven Phenocycler workflow.
#
# Raw QuPath CSV, qptiff and geometry paths are declared once in
# data/qupath_manifest.json.

[paths]
data_dir = data
qupath_manifest = data/qupath_manifest.json
marker_registry = phenocycler/marker_registry.json
broad_gate_rules = phenocycler/broad_gates.json

[restore]
# Pair-dependent production stages are currently blocked because the marker
# registry has no verified pairs. These retained algorithm settings support
# explicit development work; they are not evidence that a pair is accepted.
control_definition = reference_only
# The divisor is a finite-sample upper-tail order statistic on the validated
# reference-positive/NNMF-reference control. Alpha comes from the registry's
# fixed familywise allocation; a control too small to resolve it fails closed.
divisor_statistic = empirical_alpha
# The NNMF feature basis, read from REDSEA's compartment decomposition. `Cell`
# is deliberately absent: it is the SUM of Nucleus and Cytoplasm and contains the
# membrane band, so it is a near-copy of the others rather than an independent
# measurement. With `Cell` alone the rank-2 fit reproduces its own input to a
# relative error of 5e-5 (the manuscript's trivial solution W = Y, H = I); with
# these three it is 0.21-0.25, a genuine approximation.
feature_compartments = Nucleus,Cytoplasm,Membrane
# Floors are reported only by the historical review evaluator. Production fits
# the NNMF on a deterministic sample of all complete estimation-eligible cells,
# and component membership—not a raw Otsu split—identifies the directional arms.
nnmf_fit_basis = all
control_membership = component
# The selected production representation stays linear, nonnegative, and
# zero-preserving: divide each feature by its all-estimation-eligible robust
# upper bound without subtracting a population quantile. The three-donor
# one-factor survey preserved every pair state versus robust min-max and changed
# calls in only 3/69 donor-pairs; log1p/asinh materially changed the fit.
feature_transform = linear_upper_scale
# A failed donor-marker fit is explicit missing evidence. It must never be
# converted to a biological negative.
on_technical_failure = unavailable
# Existing exhaustive raw QuPath compartment extraction. This lets the current
# content-addressed run reuse the validated input without rescanning the 148 GB
# QuPath measurement CSV. Leave blank only for a new dataset that intentionally
# runs the recorded whole-cell-only RESTORE fallback.
# No longer used: REDSEA emits Nucleus/Cytoplasm/Membrane/Cell for every channel,
# so the 12-marker QuPath compartment export is redundant. It was also why 279 of
# 479 pairs fell back to whole cell alone, and why `pipeline status` hard-failed
# on any checkout lacking a 5.3 GB git-ignored directory.
compartment_sample =
# Explicit donor-marker biological decisions from the accepted RESTORE v10
# application. This is fingerprinted input, not a technical-failure fallback.

[cells]
min_cell_area = 5.0

[geometry_qc]
min_cell_area = 20.0
max_area_median_multiple = 4.0
min_cell_solidity = 0.70
min_raster_area_ratio = 0.50
max_raster_area_ratio = 2.00
no_cytoplasm_nc_ratio = 0.999
duplicate_radius_um = 1.0
duplicate_area_tol = 0.15
# Batch-2 islet detections contain known duplicate cell geometries. Retain one
# QC-viable nucleus-bearing detection per group and exclude every duplicate
# copy from analysis, estimation, and physical spillover context.
duplicate_policy = deterministic_keep
# InstanSeg cell fragments without a nucleus fail every cell-level QC role,
# including physical spillover context.
missing_geometry_policy = exclude

[redsea]
downsample = 1.0
edge_radius = 0
comp_mode = 1
alpha = 1.0
gap_bridge = 1
norm_form = donor
exclude_no_spillover = true

[compute]
# n_jobs is the HARD CEILING on every per-stage worker count, not an independent
# knob: ResourceLimits.from_context does
#     total = resolve_jobs(n_jobs, task_count)
#     redsea = min(pipeline_redsea_workers, total)
# and the same min() for geometry and downstream. So redsea_workers = 8 under
# n_jobs = 4 silently resolves to 4, with no warning that the request was cut.
# Raise this before raising any worker count, and confirm against the run's own
# `[queue] cpu=..., redsea=...` line rather than the flag you passed.
n_jobs = 12
duckdb_threads = 18
use_gpu = false
gpu_device = 0
# Resource-aware donor pipeline: at most twelve total tasks, including no more
# than two memory-heavy geometry rasters, eight REDSEA donors, and four
# lightweight downstream donors. GPU REDSEA is always serialized to one task per
# device.
#
# redsea_workers was 1 until 2026-08-28. Measured on this 64-core / 503 GB host,
# CPU path: REDSEA is one core per donor and its 59-channel loop is single
# threaded, so the serial setting left 63 cores idle (load 2.5, 98% idle) once
# geometry finished. At 8 donors in parallel each donor slows from ~11.4 to
# 14.6-20.8 s/channel (1.3-1.7x) but eight run at once, for ~5x net throughput;
# the cohort tail went from a ~2.5-3 h projection to well under an hour.
# Memory is the binding constraint, not CPU: peak RSS is ~30 GB for the largest
# donor (6505, 1.995 Gpx), and 8 concurrent measured a ~232 GB steady state
# against 503 GB total. Raising this further needs the RAM headroom checked
# first -- 15 concurrent would be ~450 GB and is NOT safe here.
geometry_workers = 2
redsea_workers = 8
downstream_workers = 4

[metadata]
donor_col = donor_id
status_col = disease.status

# --------------------------------------------------------------------------- #
# Everything below is read ONLY by phenocycler/integration/ (the PhenoCycler <->
# Xenium layer). The eight-stage core pipeline above never reads it.
# --------------------------------------------------------------------------- #

[lineage]
# Identity-only thresholds retained for a future declared release. Geometry export withholds
# INS/GCG/SST, and identity stages refuse to run while the release paths below are blank, so
# these values can never turn an expression intensity into an undeclared identity.
hormone_min_norm = 5
cd99_bright = 3

[integration]
# PhenoCycler <-> Xenium integration (phenocycler/integration/). Steps 1-7 of the core
# pipeline never read this section, so `python -m phenocycler.pipeline` is unaffected and
# still runs in the lean environment.
#
# sequential = serial sections from one block (cells are NOT the same cells; pairing is
#              structure/niche/donor level). same_slide = one physical section imaged twice
#              (true cell-to-cell pairing). The mode is a hard guard, not a hint.
mode = sequential

# Donor -> Xenium run manifest (donor_id, roi, batch, source_path). Vendored from
# Xenium_Analysis, where it is a hand-maintained file that no code reads.
xenium_paths_csv = data/integration/xenium_paths.csv
# donor_id for Xenium samples that xenium_paths.csv does not cover (e.g. 0041323/0041326,
# which have processed h5ads but no recorded donor). Columns: xenium_sample_key, donor_id, roi.
donor_overrides_csv = data/integration/donor_overrides.csv
# Exact exceptions to filename-based PhenoCycler section resolution. The core run and
# qupath_manifest remain authoritative; this file only resolves names that cannot encode a
# donor/ROI unambiguously.
section_overrides_csv = data/integration/section_overrides.csv
# Optional declared identity releases. Blank is the current fail-closed state.
phenocycler_identity_release = ../../data/development/broadtype/release
xenium_identity_release = ../../data/development/xenium_typing/release
# Where the Xenium tree lives on THIS machine. xenium_paths.csv records bundle paths
# relative to the tree:
#   HuPrime5kPanTissue/<batch>/<run>/output-XETG...
# so no site's filesystem layout is baked into a tracked file, and this is the one knob
# that says where the tree actually is.
#
# The data is on HiPerGator under /orange/maigan and comes across by Globus TRANSFER, not
# by mount — Globus Connect Personal is registered on this workstation and /data is
# already one of its shared paths. So this points at the local destination, and the tree
# is laid out to match the recorded relative paths.
#
# NOT YET TRANSFERRED (2026-08-25): --verify-paths will report every row 'missing' until
# the copy lands. Verify with:
#     python -m phenocycler.integration.manifest --verify-paths
# which exits non-zero and names every path that does not resolve. A row reported
# 'relocated' means the bundle was found by name but not where recorded — repair
# xenium_paths.csv rather than bending this knob.
xenium_root = /data/xenium
# Panel taxonomy. Supplies panel_roles.csv + identity_core/*, which the upstream repo ships
# specifically as a machine-readable contract for Python. It used to be a git submodule at
# external/XeniumPanelExplorer; in the monorepo it is the sibling subtree core/panels.
# Relative paths here resolve against this file's directory (core/phenocycler).
panel_explorer = ../panels

# --- Tissue -----------------------------------------------------------------
# The integration package supports pancreas and pancreatic lymph node, but the current
# immutable PhenoCycler run contains 20 pancreas sections only. The Xenium catalog's pLN rows
# remain xenium_only; configuration does not imply a measurement exists.
# Tissue is a property of the DATASET, fixed when it is imported, and rides through the cell
# table as a column — so every stage runs on one tissue or on both, selected with --tissue,
# rather than tissue being a global mode you have to remember to flip.
#
# The two tissues diverge in exactly two places, both biological:
#   * structures — a lymph node has no islets, so the structure level (S3) and islet matching
#     (S6) do not run for it. Registration, niches, the grid, donor composition and
#     pseudo-cell linking all still do.
#   * identity panels — XeniumPanelExplorer ships pancreas and thymus, no lymph node, and the
#     cores a lymph node needs are exactly the shared immune/vascular/stromal/neural ones. So
#     pLN resolves to the shared pool and the three pancreas-specific cores are excluded.
# See phenocycler/integration/tissues.py, which is the single place that knows the difference.
#
# Default tissue for a dataset that declares none (also picks the
# core/panels/data/tissues/<tissue>/ directory).
tissue = pancreas
# Supported tissues. A bare pipeline selection covers both, then stages retain observed rows.
tissues = pancreas,pancreatic_lymph_node
# OPTIONAL override, as `tissue=/path,tissue=/path`. You almost certainly do not need this.
#
# One core-pipeline run covers both tissues: partitions are keyed by SECTION, not donor, so
# 6539_Scan1.er.qptiff -> donor_id=6539 and 6539pLN_Scan1.er.qptiff -> donor_id=6539pln
# (phenocycler/sections.py). Set this only when a tissue came from a SEPARATE core-pipeline
# run — a different QuPath export, hence a different data dir. Left empty, every tissue is
# read from data_dir, which is correct for the normal case.
pheno_tissue_dirs =

# Registration. The FIXED frame is the one everything is warped into.
fixed_modality = phenocycler
reg_pixel_um = 2.0        # raster resolution for mask/image registration
# B-spline stage after rigid+affine. OFF for this lane as of 2026-09-10, on measurement
# rather than preference. Nothing consumes the field -- run_pheno_annotation_export.py has had
# --use-displacement off by default since it landed -- and it is not invertible where it
# matters: measured on the real annotation vertices, 15.0% (6436) and 6.1% (6442) of them fail
# the round trip the exporter requires, which costs 90 and 48 publishable islets respectively.
# Affine-only round-trips at 4e-12 um on the same vertices. Turn it back on only alongside a
# consumer for it and a passing displacement_report.
reg_nonrigid = false
reg_max_disp_um = 200     # displacement cap; see displacement_report() on how it can fold
# PhenoCycler and Xenium both report calibrated microns, so the true transform between two
# serial sections is rigid up to real tissue stretch: scale ~1 on BOTH axes, no shear. ECC's
# affine stage has six free parameters and, driven by a partial-overlap silhouette, will trade
# an unphysical stretch for apparent correlation -- donor 6436 came back with a 10.7% x-only
# stretch (+5.09% linear, 509 um of drift over 10 mm). These bound what it may return before
# the rigid fit is kept instead.
reg_max_anisotropy = 1.03        # max ratio between the two axis scales
reg_max_scale_deviation = 0.05   # max |linear scale - 1|

# How many of the 144 coarse orientation hypotheses (72 angles x mirror) reach the fine
# stage. This was a fixed 3 until 2026-09-10, and on donor 6436 the correct hypothesis ranked
# 4th -- cut by one position, which is the whole reason that donor's registration was wrong by
# 14 deg and 0.8 mm. Coarse scores bunch when one section is a sub-field of the other, so the
# rule is a plateau, not a rank: refine everything within keep_frac of the best.
reg_coarse_keep_frac = 0.97
reg_coarse_min_candidates = 8
reg_coarse_max_candidates = 24

# Islet calling. Identical on both modalities so the structures are comparable; the values
# are Xenium_Analysis/scripts/insulitis_analysis.py EPS_UM / MIN_SAMPLES. Seeds are
# hormone-POSITIVE cells, not lineage labels (label seeding finds ~2-9 islets vs 112+).
# The PhenoCycler seed threshold is [lineage] hormone_min_norm, already 5.
islet_eps_um = 50
islet_min_samples = 10

# Niches: mirrors Xenium_Analysis nb03 cell 12 (kNN composition -> KMeans -> majority
# smoothing) so the two modalities' niche vocabularies are directly comparable.
niche_k = 50
niche_n = 12
niche_smooth_k = 30
# Registered-frame hex grid (the registration-dependent second view).
grid_um = 100

# Islet <-> islet matching gates.
match_max_dist_um = 200
match_area_ratio = 2.5

# Post-Xenium re-stain (S1c). The Xenium section is re-stained for INS/GCG on the PhenoCycler
# afterwards, which is the one place in this cohort where protein and RNA measure the SAME
# cell. Those qptiffs flow through the CORE pipeline like any other, so they need a section
# token that phenocycler/sections.py recognises (`xen`, `xpanc`, `xenpln`, `xpln` — e.g.
# 6539xen_Scan1.er.qptiff); an unrecognised token is refused rather than guessed at.
#
# Set this to true ONLY once postxen has actually stamped endocrine_subtype onto the Xenium
# table. It upgrades Xenium Endocrine in the vocabulary crosswalk from `surrogate` (called
# from PDX1/ISL1/NEUROD1/ABCC8, because INS/GCG/SST are off the 5K panel) to `yes` — i.e. it
# asserts a hormone-protein measurement, so setting it early claims data you do not have.
xenium_hormone_if = false

# Pseudo-cell linking refuses to run below this many verified protein<->gene anchors.
# INS/GCG/SST/Vimentin are off the Xenium panel, so the usable set is thinner than the
# 46 nominal 1:1 pairs and must not be allowed to silently collapse to a handful.
crossmodal_min_anchors = 8

# Registration QC gates. FAIL donors are excluded from structure/niche/pseudo-cell
# analyses but still contribute to the registration-free donor-level comparison.
qc_tissue_dice_min = 0.80
qc_islet_rmse_max_um = 150
