schema: multiplex5000-project/1
id: spleen_primary
release: spleen-primary-candidate-1
cohort: spleen_phenocycler_primary
# Production protein measurement only: ingest -> geometry QC -> REDSEA -> expression. No
# same_slide_source_manifest, so Stage 03 takes the full route, not the pilot adapter.
# Normalization and typing for spleen are decided after this release's expression exists.
stages: [03_protein_measurement]
# Unlike io60, Stage 03 waits for acceptance: it is this release's only stage, so its gate is
# the one review of the measurement before anything downstream reads it.
automatic_gates: []
settings:
  # REDSEA partitions at once. Each reads its whole qptiff channel by channel (the 67-plex
  # slides are 1.15 Gpx); set from the first single-section run's peak memory.
  measurement_jobs: 3
# The site file supplies qupath_manifest and analysis_exclusions (SpleenFollicleCounterQP
# analysis/approved/analysis_exclusions, cells outside the approved refined tissue masks).
