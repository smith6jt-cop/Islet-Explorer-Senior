schema: multiplex5000-profile/1
kind: platform
id: phenocycler
display_name: PhenoCycler
# Full-resolution pixel size of the IO60 qptiffs.
pixel_size_um: 0.5078
# How a PhenoCycler panel is named (maintainer, 2026-10-21): the number of markers an image
# records, DAPI not counted; then '+' or '-' for the one marker that tells two panels of that size
# apart; or MetSI where the metabolic spike-in is in the panel -- 57, 58+ (CD38), 58- (b-catenin1),
# 69MetSI, and 55 for the dedicated pLN slides. Applied by multiplex5000.panel_names.
panel_names:
  not_counted: [DAPI]
  single_marker:
    "+": CD38
    "-": b_Catenin1
  # The metabolic markers the 70-channel panel adds; every one must be present to name it MetSI.
  metabolic_spike_in: [ASCT2, ATP5A, CS, G6PD, GLUT1, HK1, IDH2, LDHA, SDHA]
  metabolic_suffix: MetSI
sources:
  pixel_size_um: apps/islet/config/run20_default.yml pixel_size_um (the QuPath preflight declares the same)
  panel_names: the maintainer's naming, 2026-10-21; markers as each qptiff's ScanProfile records them
