schema: multiplex5000-profile/1
kind: cohort
id: io60_phenocycler
platform: phenocycler
tissues: [pancreas, pancreatic_lymph_node]
# Membership and exclusions each have one authority; a cohort profile names them and never lists
# donors (CLAUDE.md: no lane may restate the exclusion list).
membership: core/multiplex5000/cohort-spec.json
exclusions: multiplex5000.cohort.DONOR_EXCLUSIONS
# Labels the recorded sources use for a donor that are not its id. Each is declared with where it
# is seen, because a label is never read out of a filename (D2; the maintainer confirmed all three
# on 2026-10-20):
#   0112 -- the id in cohort-spec.json and the QuPath manifest;
#           112 in xenium_paths.csv and section_modes.csv;
#           HDL112 in the donor notes and results/v3/pln_blocks.csv.
#   115  -- the id in cohort-spec.json and the QuPath manifest;
#           HDL115 in the donor notes and results/v3/pln_blocks.csv.
donor_aliases:
  "112": "0112"
  HDL112: "0112"
  HDL115: "115"
# The disease statuses in their order, and every spelling a recorded source uses for one: the
# project's donor_metadata_panc.xlsx (disease.status) and nPOD's case export (donor_type). On the
# 24 nPOD donors the two share they agree, spelling for spelling (checked 2026-10-22).
disease_status:
  levels: [ND, Aab+, T1D]
  spellings:
    ND: ND
    AAB: Aab+
    T1D: T1D
    No Diabetes: ND
    Autoantibody Positive: Aab+
    Type 1 Diabetes: T1D
